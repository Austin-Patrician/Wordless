name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must match vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Validate Google OAuth configuration
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ ! "$GOOGLE_OAUTH_CLIENT_ID" =~ \.apps\.googleusercontent\.com$ ]]; then
            echo "Repository variable GOOGLE_OAUTH_CLIENT_ID must contain a Google Desktop OAuth client ID" >&2
            exit 1
          fi
          if [[ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]]; then
            echo "Repository secret GOOGLE_OAUTH_CLIENT_SECRET is required for Google Desktop OAuth" >&2
            exit 1
          fi

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check --workspace=@wordless/desktop
      - name: Prepare Linux OfficeCLI test assets
        run: npm run prepare:officecli --workspace=@wordless/desktop
      - run: npm run test:host --workspace=@wordless/desktop

  build-macos:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Set package version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}" --workspace=@wordless/desktop
      - name: Build unsigned macOS artifacts
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WORDLESS_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          WORDLESS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          node scripts/prepare-officecli-assets.mjs --platform darwin --arch ${{ matrix.arch }}
          npm run build:renderer
          npm run build:electron
          npx electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --publish never
          npm run verify:packaged-fff -- release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wordless-macos-${{ matrix.arch }}
          retention-days: 3
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error

  build-windows:
    needs: [prepare, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Prepare Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CSC_LINK is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CSC_KEY_PASSWORD is required"
          }
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64.Trim())
          } catch {
            throw "WINDOWS_CSC_LINK is not complete Base64. Replace it with the complete contents of WINDOWS_CSC_LINK.txt."
          }
          if ($certificateBytes.Length -lt 1024) {
            throw "WINDOWS_CSC_LINK decoded to an invalid certificate file"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "wordless-internal-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          try {
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath, $env:WINDOWS_CERTIFICATE_PASSWORD, $flags)
          } catch {
            throw "The signing PFX or WINDOWS_CSC_KEY_PASSWORD is invalid"
          }
          if (-not $certificate.HasPrivateKey) {
            throw "The signing PFX does not contain a private key"
          }
          Write-Host "Loaded Windows signing certificate: $($certificate.Subject)"
      - run: npm ci
      - name: Set package version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}" --workspace=@wordless/desktop
      - name: Build signed Windows artifacts
        env:
          WIN_CSC_LINK: ${{ runner.temp }}\wordless-internal-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WORDLESS_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          WORDLESS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run dist:win --workspace=@wordless/desktop
      - name: Verify packaged FFF native search
        working-directory: apps/desktop
        run: npm run verify:packaged-fff -- release/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: wordless-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error

  publish:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wordless-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)"
            test "$IS_DRAFT" = "true" || { echo "Release $RELEASE_TAG is already published" >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Wordless $RELEASE_VERSION" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
