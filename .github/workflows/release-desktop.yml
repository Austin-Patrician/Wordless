name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string
      mirror_only:
        description: "Only re-sync an existing published release to R2"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must match vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Validate Google OAuth configuration
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_only }}
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ ! "$GOOGLE_OAUTH_CLIENT_ID" =~ \.apps\.googleusercontent\.com$ ]]; then
            echo "Repository variable GOOGLE_OAUTH_CLIENT_ID must contain a Google Desktop OAuth client ID" >&2
            exit 1
          fi
          if [[ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]]; then
            echo "Repository secret GOOGLE_OAUTH_CLIENT_SECRET is required for Google Desktop OAuth" >&2
            exit 1
          fi

  verify:
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check --workspace=@wordless/desktop
      - name: Prepare Linux OfficeCLI test assets
        run: npm run prepare:officecli --workspace=@wordless/desktop
      - run: npm run test:host --workspace=@wordless/desktop

  build-macos:
    needs: [prepare, verify]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Set package version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}" --workspace=@wordless/desktop
      - name: Build unsigned macOS artifacts
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WORDLESS_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          WORDLESS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          node scripts/prepare-officecli-assets.mjs --platform darwin --arch ${{ matrix.arch }}
          npm run build:renderer
          npm run build:electron
          npx electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --publish never
          npm run verify:packaged-fff -- release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wordless-macos-${{ matrix.arch }}
          retention-days: 3
          path: |
            apps/desktop/release/Wordless-*-mac-${{ matrix.arch }}.dmg
            apps/desktop/release/Wordless-*-mac-${{ matrix.arch }}.dmg.blockmap
            apps/desktop/release/Wordless-*-mac-${{ matrix.arch }}.zip
            apps/desktop/release/Wordless-*-mac-${{ matrix.arch }}.zip.blockmap
          if-no-files-found: error

  build-windows:
    needs: [prepare, verify]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Prepare Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CSC_LINK is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CSC_KEY_PASSWORD is required"
          }
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64.Trim())
          } catch {
            throw "WINDOWS_CSC_LINK is not complete Base64. Replace it with the complete contents of WINDOWS_CSC_LINK.txt."
          }
          if ($certificateBytes.Length -lt 1024) {
            throw "WINDOWS_CSC_LINK decoded to an invalid certificate file"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "wordless-internal-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          try {
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath, $env:WINDOWS_CERTIFICATE_PASSWORD, $flags)
          } catch {
            throw "The signing PFX or WINDOWS_CSC_KEY_PASSWORD is invalid"
          }
          if (-not $certificate.HasPrivateKey) {
            throw "The signing PFX does not contain a private key"
          }
          Write-Host "Loaded Windows signing certificate: $($certificate.Subject)"
      - run: npm ci
      - name: Set package version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}" --workspace=@wordless/desktop
      - name: Build signed Windows artifacts
        env:
          WIN_CSC_LINK: ${{ runner.temp }}\wordless-internal-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WORDLESS_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          WORDLESS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run dist:win --workspace=@wordless/desktop
      - name: Verify packaged FFF native search
        working-directory: apps/desktop
        run: npm run verify:packaged-fff -- release/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: wordless-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error

  publish:
    needs: [prepare, build-macos, build-windows]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wordless-*
          path: release
          merge-multiple: true
      - name: Generate combined macOS update metadata
        run: |
          node apps/desktop/scripts/generate-mac-update-manifest.mjs \
            --release-dir release \
            --version "${{ needs.prepare.outputs.version }}" \
            --output release/latest-mac.yml
      - name: Generate checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)"
            test "$IS_DRAFT" = "true" || { echo "Release $RELEASE_TAG is already published" >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Wordless $RELEASE_VERSION" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  mirror-r2:
    needs: [prepare, publish]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.mirror_only)) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_RETENTION: "5"
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo "Repository variable CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "Repository variable R2_BUCKET_NAME is required" >&2; exit 1; }
          [[ "$R2_PUBLIC_BASE_URL" =~ ^https:// ]] || { echo "Repository variable R2_PUBLIC_BASE_URL must be an HTTPS URL" >&2; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Repository secret R2_ACCESS_KEY_ID is required" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Repository secret R2_SECRET_ACCESS_KEY is required" >&2; exit 1; }
          test "${#AWS_ACCESS_KEY_ID}" -eq 32 || { echo "R2_ACCESS_KEY_ID must be the 32-character R2 Access Key ID, not the API token value" >&2; exit 1; }
      - name: Download the published GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          test -f release/SHA256SUMS.txt || { echo "Published release is missing SHA256SUMS.txt" >&2; exit 1; }
          (cd release && sha256sum --check SHA256SUMS.txt)
      - name: Generate release manifest from published assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" > release/github-releases.json
          node apps/desktop/scripts/generate-release-manifest.mjs \
            --release-dir release \
            --github-releases release/github-releases.json \
            --output release/releases.json \
            --public-base-url "${R2_PUBLIC_BASE_URL%/}/releases" \
            --current-tag "$RELEASE_TAG"
      - name: Upload release files to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload_and_verify() {
            local file="$1"
            local cache_control="$2"
            local content_type="${3:-}"
            local name size hash remote
            name="$(basename "$file")"
            size="$(stat -c %s "$file")"
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            local -a args=(
              "$file" "s3://${R2_BUCKET_NAME}/releases/${name}"
              --endpoint-url "$ENDPOINT"
              --cache-control "$cache_control"
              --metadata "sha256=$hash"
              --no-progress
            )
            if [[ -n "$content_type" ]]; then args+=(--content-type "$content_type"); fi
            aws s3 cp "${args[@]}"
            remote="$(aws s3api head-object \
              --bucket "$R2_BUCKET_NAME" \
              --key "releases/${name}" \
              --endpoint-url "$ENDPOINT" \
              --query '[ContentLength, Metadata.sha256]' \
              --output text)"
            read -r remote_size remote_hash <<< "$remote"
            test "$remote_size" = "$size" || { echo "R2 size mismatch for $name" >&2; exit 1; }
            test "$remote_hash" = "$hash" || { echo "R2 hash metadata mismatch for $name" >&2; exit 1; }
          }
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              latest.yml|latest-mac.yml) upload_and_verify "$file" "no-cache, max-age=0" "text/yaml" ;;
              SHA256SUMS.txt) upload_and_verify "$file" "no-cache, max-age=0" "text/plain" ;;
              *) upload_and_verify "$file" "public, max-age=31536000, immutable" ;;
            esac
          done < <(find release -maxdepth 1 -type f ! -name github-releases.json ! -name releases.json -print0)
          upload_and_verify release/releases.json "no-cache, max-age=0" "application/json"
      - name: Verify public R2 release manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="${R2_PUBLIC_BASE_URL%/}/releases/releases.json"
          curl --fail --location --retry 5 --retry-all-errors --max-time 30 "$MANIFEST_URL" -o downloaded-releases.json
          node - <<'NODE'
          void (async () => {
            const manifest = require("./downloaded-releases.json");
            const release = manifest.releases?.find((candidate) => `v${candidate.version}` === process.env.RELEASE_TAG);
            if (manifest.schemaVersion !== 1 || !release) throw new Error("The public R2 manifest does not contain the mirrored release");
            const base = `${process.env.R2_PUBLIC_BASE_URL.replace(/\/$/, "")}/releases/`;
            const mirrored = release.assets.filter((asset) => asset.urls?.[0]?.startsWith(base));
            if (!mirrored.length) throw new Error("The public manifest does not expose R2 assets");
            await Promise.all(mirrored.map(async (asset) => {
              const response = await fetch(asset.urls[0], { method: "HEAD", signal: AbortSignal.timeout(30_000) });
              const size = Number(response.headers.get("content-length"));
              if (!response.ok || size !== asset.size) throw new Error(`Public R2 asset verification failed for ${asset.name}`);
            }));
            console.log(`Verified ${mirrored.length} public R2 assets for ${process.env.RELEASE_TAG}`);
          })();
          NODE
      - name: Retain the latest five R2 releases
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET_NAME" \
            --prefix "releases/" \
            --endpoint-url "$ENDPOINT" \
            --output json > r2-objects-before-prune.json
          node apps/desktop/scripts/plan-r2-release-retention.mjs \
            --github-releases release/github-releases.json \
            --r2-objects r2-objects-before-prune.json \
            --output-directory r2-retention-plan \
            --retain "$R2_RELEASE_RETENTION"
          shopt -s nullglob
          plans=(r2-retention-plan/delete-*.json)
          for plan in "${plans[@]}"; do
            aws s3api delete-objects \
              --bucket "$R2_BUCKET_NAME" \
              --endpoint-url "$ENDPOINT" \
              --delete "file://${plan}"
          done
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET_NAME" \
            --prefix "releases/" \
            --endpoint-url "$ENDPOINT" \
            --output json > r2-objects-after-prune.json
          node apps/desktop/scripts/plan-r2-release-retention.mjs \
            --github-releases release/github-releases.json \
            --r2-objects r2-objects-after-prune.json \
            --output-directory r2-retention-verification \
            --retain "$R2_RELEASE_RETENTION" \
            --verify-clean
