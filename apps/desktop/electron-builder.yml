appId: com.wordless.desktop
productName: Wordless
artifactName: Wordless-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
icon: src/icons/common-icons/wordless.png
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@ff-labs/**/*
  - node_modules/ffi-rs/**/*
  - node_modules/@yuuang/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  # 设计样式编译那棵树(原生模块 + 运行期由 JS 解析器去读的 CSS)。
  # 这份清单与 `scripts/external-packages.mjs` 的 NATIVE_ASAR_UNPACK 由测试逐条比对。
  - node_modules/@tailwindcss/**/*
  - node_modules/lightningcss*/**/*
extraResources:
  - from: resources/skills
    to: skills
  - from: resources/officecli/${os}-${arch}
    to: officecli/${os}-${arch}
  - from: resources/presentation-templates
    to: presentation-templates
  - from: resources/third-party-notices
    to: third-party-notices
extraMetadata:
  dependencies:
    '@ff-labs/fff-node': '0.10.1'
    ajv: '^8.20.0'
    ajv-formats: '^3.0.1'
    sharp: '0.35.3'
mac:
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Wordless
  sign: false
win:
  # The internal release certificate is not installed in end-user trust stores.
  # Keep signing the binaries, but do not emit a publisher check that would block updates.
  verifyUpdateCodeSignature: false
  icon: src/icons/common-icons/wordless.png
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
publish:
  provider: github
  owner: Austin-Patrician
  repo: Wordless
  releaseType: release
