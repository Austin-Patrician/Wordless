appId: com.wordless.desktop
productName: Wordless
artifactName: Wordless-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
icon: src/icons/common-icons/wordless.png
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@ff-labs/**/*
  - node_modules/ffi-rs/**/*
  - node_modules/@yuuang/**/*
extraResources:
  - from: resources/skills
    to: skills
  - from: resources/officecli/${os}-${arch}
    to: officecli/${os}-${arch}
  - from: resources/presentation-templates
    to: presentation-templates
  - from: resources/third-party-notices
    to: third-party-notices
extraMetadata:
  dependencies:
    '@ff-labs/fff-node': '0.10.1'
    ajv: '^8.20.0'
    ajv-formats: '^3.0.1'
mac:
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Wordless
  sign: false
win:
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
publish:
  provider: github
  owner: Austin-Patrician
  repo: Wordless
  releaseType: release
