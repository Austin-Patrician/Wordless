appId: com.wordless.desktop
productName: Wordless
artifactName: Wordless-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
icon: src/icons/common-icons/wordless.png
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/@ff-labs/**/*
  - node_modules/ffi-rs/**/*
  - node_modules/@yuuang/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  # 设计样式编译那棵树(原生模块 + 运行期由 JS 解析器去读的 CSS)。
  # 这份清单与 `scripts/external-packages.mjs` 的 NATIVE_ASAR_UNPACK 由测试逐条比对。
  - node_modules/@tailwindcss/**/*
  - node_modules/lightningcss*/**/*
extraResources:
  # 局域网模式要托管的网页客户端。**必须随包发布**:打包版用户没有 npm,
  # 不能让他"先构建一次"(见 docs/architecture/remote-deployment.md §2.3)。
  # 主进程按 process.resourcesPath/web-client 找它。
  - from: ../web-client/dist
    to: web-client
    filter:
      - "**/*"
  # 远程部署用的中继单文件(自包含:服务器上不装 npm 依赖)。见 scripts/build-relay-bundle.mjs。
  - from: resources/relay
    to: relay
    filter:
      - "**/*"
  # `__pycache__` / `.pyc` 是**运行时产物**,不是资产的一部分:内置 Python 树在开发机上跑过一次
  # 就会长出几千个 .pyc(实测一个本地包因此从 68MB 涨到 313MB),而 CI 全新解压出来是干净的 ——
  # 不排掉的话"同一个 commit 本地打的包和 CI 打的包不一样大"。技能目录里那两个 .pyc 也一样。
  # 排掉之后 Python 首次 import 时自己重编译,没有功能损失。
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: resources/officecli/${os}-${arch}
    to: officecli/${os}-${arch}
  # 内置的可重定位 CPython(打包期准备,见 scripts/prepare-python-runtime.mjs)。
  # 应用**不原地使用**它:首启拷到用户目录再跑,免得改坏签名/撞上不可写的安装目录。
  - from: resources/python/${os}-${arch}
    to: python/${os}-${arch}
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # 内置的文字识别资产(打包期准备,见 scripts/prepare-ocr-assets.mjs)。模型与 wasm 必须
  # 能被渲染器按路径直读,所以放在 asar 外。
  - from: resources/ocr
    to: ocr
  # OCR 运行器页面(隐藏窗口加载的那一页)。
  - from: dist/ocr-runner
    to: ocr-runner
  - from: resources/presentation-templates
    to: presentation-templates
  - from: resources/third-party-notices
    to: third-party-notices
extraMetadata:
  dependencies:
    '@ff-labs/fff-node': '0.10.1'
    ajv: '^8.20.0'
    ajv-formats: '^3.0.1'
    sharp: '0.35.3'
mac:
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0.0'
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Wordless
  sign: false
win:
  # The internal release certificate is not installed in end-user trust stores.
  # Keep signing the binaries, but do not emit a publisher check that would block updates.
  verifyUpdateCodeSignature: false
  icon: src/icons/common-icons/wordless.png
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
linux:
  # 三个目标各有分工:AppImage 是**唯一能自更新**的那个(electron-updater 在 Linux 只认
  # `APPIMAGE` 环境变量,deb/rpm 装出来的应用连 checkForUpdates 都不会发事件);deb/rpm 是
  # 传统安装路径,只作为普通下载,不进更新清单。
  #
  # `target` 必须显式写:electron-builder 的 Linux 默认值是 `[snap, appimage]`,而 runner 上
  # 没有 snapcraft —— 不写就是构建直接失败。
  target:
    - AppImage
    - deb
    - rpm
  # 可执行文件名显式钉住。Linux 的默认值是 productName 小写(`wordless`),三个校验脚本按这个
  # 名字找可执行文件 —— 依赖默认值等于让"哪天默认值变了"在打包后才暴露。
  executableName: wordless
  category: Utility
  synopsis: Local-first desktop agent workspace
  # deb/rpm 的 Maintainer/Vendor 字段。不写就得靠 package.json 的 author.email(现在没有)。
  maintainer: Wordless Contributors <wordless@users.noreply.github.com>
  vendor: Wordless
publish:
  provider: github
  owner: Austin-Patrician
  repo: Wordless
  releaseType: release
