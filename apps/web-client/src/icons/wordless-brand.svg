<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Slate -->
    <linearGradient id="monogramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Fluorescent Green Accent Gradient -->
    <linearGradient id="fluorescentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EFA8B" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>

    <!-- Subtle Neon Glow for the Execution Stroke -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00FF7F" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#monogramBg)" stroke="#1F2937" stroke-width="2.5" />

  <!-- Left Stem: Focused, steady baseline work (Pure Signal White) -->
  <path d="M 124 186 L 192 342 C 196 352, 208 356, 218 348 L 268 288" 
        fill="none" stroke="#F9FAFB" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Stem: Dynamic Checkmark executing upward (Fluorescent Green) -->
  <path d="M 238 274 L 294 340 C 302 350, 316 350, 324 340 L 416 148" 
        fill="none" stroke="url(#fluorescentGreen)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" 
        filter="url(#neonGlow)" />
</svg>
