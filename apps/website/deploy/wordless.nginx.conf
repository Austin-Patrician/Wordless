# Replace wordless.example.com and /var/www/wordless with production values.
# Point `root` at the `current` symlink so a deployment can switch atomically.
server {
    listen 80;
    listen [::]:80;
    server_name wordless.example.com;

    root /var/www/wordless/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# After DNS is pointed at the server, run:
# sudo certbot --nginx -d wordless.example.com
